# Output resolution, bd_aspect_ratio (bodies in src/gpu/output_resolution.cpp).
# Render BD's device composite chain at the swapchain size so the present is 1:1
# instead of a 1280x720 stretch.

# Device backbuffer dims (dword_82DDA670/674) + display float dims (qword_82DDA5E8)
# at the tail of bdInitGpuMemory.
[[midasm_hook]]
address = 0x82272E38
name = "bdOutputResDeviceDimsHook"
registers = []
after_instruction = false

# Neutralize bdRenderStep's per-frame force-to-1280 (cmplwi r11,0x500, HD path):
# jump past the force + reset flag block to loc_82132D60.
[[midasm_hook]]
address = 0x82132D28
name = "bdOutputResRenderStepNeutralizeHook"
registers = []
after_instruction = false
jump_address_on_true = 0x82132D60

# Scale the hardcoded composite/history CreateTexture(0x500,0x2D0) in
# VisualRender__ctor (bl D3DDevice_CreateTexture; r3=Width r4=Height).
[[midasm_hook]]
address = 0x82133408
name = "bdOutputResCompositeTexScaleHook"
registers = ["r3", "r4"]
after_instruction = false

# Projection aspect + fov in bdBuildProjectionMatrix, at the aspect load
# (lfs f29, 8(r30)). f1 already holds fov/2 from the fmuls four instructions up
# and neither is touched again before bdSinCos consumes them.
[[midasm_hook]]
address = 0x82168E78
name = "bdProjectionAspectHook"
registers = ["f1", "f29"]
after_instruction = true

# The same build inlined in bdViewCameraUpdate, off the camera globals (fov
# 0x82DDA8FC, aspect 0x82DDA900, near/far 0x82DDA904/908) instead of a camera
# struct, then pushed to the device constants. bdBattleSceneUpdate runs it, so
# the battle overwrote its corrected projection with a design aspect one. At the
# aspect load; f1 holds fov/2 from the fmuls above it.
[[midasm_hook]]
address = 0x822781E4
name = "bdProjectionAspectHook"
registers = ["f1", "f29"]
after_instruction = true

# And again in FreeDfsTask_BuildViewProjection, for the close-up view the
# battle intro fades out through. It divides by that view's own width over
# height (fdivs f30 at 0x8228C15C), so the aspect rides f30 and the view has to
# be size-checked through r31. At the fmuls that leaves fov/2 in f1; f30
# reaches the divide below bdSinCos.
[[midasm_hook]]
address = 0x8228C17C
name = "bdViewProjectionAspectHook"
registers = ["r31", "f1", "f30"]
after_instruction = true

# Camera sub-views are sized in design canvas units by every
# bdCameraViewSetScreenSize caller (FreeDfsTask close-ups, the talk portrait
# via issEvent__Update, Camp__MainTask__vf03), so hook the callee entry rather
# than each call site. f1/f2 = render dims, f3/f4 = display dims; only f1/f2
# are scaled, so placement, the tasks' cached copies, and the r31+0x1D0
# full-frame check in bdViewProjectionAspectHook all keep authored values. The
# view texture takes the create-time render dims and Visual__UnitNormal__vf03
# sizes the scene surfaces from that texture, so one scale reaches the chain.
[[midasm_hook]]
address = 0x82134DE0
name = "bdOutputResViewScaleHook"
registers = ["f1", "f2"]
after_instruction = false

[[midasm_hook]]
address = 0x823F76E4
name = "bdIssEventDimHook"
registers = ["r10", "r11"]
after_instruction = true

# And a fourth, bdBuildMirrorViewProjection, the mirror view bdRenderViewSubmit
# builds for the planar reflection. The water samples it at the pixel's screen UV,
# so the reflection has to be framed exactly like the scene. Left out of the set
# it renders at the authored fov while the scene carries bd_fov_offset, and the
# reflection comes back magnified by the ratio of the two tangents. At the fmuls
# that leaves fov/2 in f1; the aspect is loaded into f29 four instructions up and
# survives bdSinCos there.
[[midasm_hook]]
address = 0x821782F4
name = "bdProjectionAspectHook"
registers = ["f1", "f29"]
after_instruction = true

# Master dim: VisualRender screenW/H (+0x1A38/+0x1A3C), patched after the ctor's 720.0
# store; r31 = VisualRender this.
[[midasm_hook]]
address = 0x82133174
name = "bdOutputResScreenDimsHook"
registers = ["r31"]
after_instruction = true

