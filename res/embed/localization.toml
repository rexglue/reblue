# re:Blue UI text. Every line is "<key>.<code>", English first and each
# translation of that line under it.
#
# The codes are the ones Blue Dragon uses: us jp de fr es it kr tw cn po. A
# language with no line for a key reads the ".us" line above, so a missing
# translation is a missing line and the English it needs is the line above it.
#
# Baked into the binary at build time. A localization.toml in the bd_lang_path
# folder merges over the baked one key by key.
#
# Keep the "{}" placeholders, which is where a name, count or key gets
# substituted in. Write "{0}" style to put them in another order.
#
# "@game:<table>/<KEY>|literal" takes Blue Dragon's own wording for a term in
# whatever language it is running, and reads the literal when the install does
# not ship that language. One ".us" line covers every language, so translate
# one of those only to override the game's own word.

